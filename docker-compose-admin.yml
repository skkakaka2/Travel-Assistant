version: "3.2"

services:
  tra-backend:
    image: node:24-alpine
    container_name: tra-backend
    entrypoint: ["docker-entrypoint.sh"]
    command: ["./docker-entrypoint.sh"]
    working_dir: /app
    volumes:
      # 后端应用目录
      - /home/admin/travelassistant:/app:rw
    networks:
      - kong-net
    restart: unless-stopped
    tty: true
    stdin_open: true
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "10m"
    environment:
      - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - NODE_VERSION=24.11.1
      - YARN_VERSION=1.22.22

  tra-frontend:
    image: nginx:alpine
    container_name: tra-frontend
    entrypoint: []
    command: ["/app/frontend/docker-entrypoint.sh"]
    ports:
      - "8008:80"
    volumes:
      # Nginx 配置文件
      - /home/admin/travelassistantFrontend/ngconf/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端应用目录
      - /home/admin/travelassistantFrontend:/app/frontend:rw
      # Nginx 日志目录
      - /var/log/nginx:/var/log/nginx:rw
      # 上传文件目录
      - /home/admin/travelassistant/uploads:/app/uploads:rw
    networks:
      - kong-net
    restart: unless-stopped
    tty: true
    stdin_open: true
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "10m"
    environment:
      - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - NGINX_VERSION=1.29.4
      - PKG_RELEASE=1
      - DYNPKG_RELEASE=1
      - NJS_VERSION=0.9.4
      - NJS_RELEASE=1

networks:
  kong-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  konga_data:
    driver: local