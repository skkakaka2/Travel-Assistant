version: "3.2"

services:
  postgres:
    image: postgres:9.6
    container_name: kong-database
    environment:
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
      POSTGRES_DB: kong
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kong-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-konga:
    image: postgres:9.6
    container_name: konga-database
    environment:
      POSTGRES_USER: konga
      POSTGRES_PASSWORD: konga
      POSTGRES_DB: konga
    volumes:
      - konga_data:/var/lib/postgresql/data
    networks:
      - kong-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konga"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong:
    image: kong:2.8.1
    container_name: kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
      - "8443:8443"
      - "8444:8444"
    networks:
      - kong-net
    restart: unless-stopped
    entrypoint: /bin/sh
    command: -c "kong migrations bootstrap && kong migrations up && /docker-entrypoint.sh kong docker-start"

  konga:
    image: pantsel/konga:0.14.9
    container_name: konga
    environment:
      TOKEN_SECRET: konga-token-secret
      DB_ADAPTER: postgres
      DB_HOST: postgres-konga
      DB_USER: konga
      DB_PASSWORD: konga
      DB_DATABASE: konga
      NODE_ENV: development
    depends_on:
      postgres-konga:
        condition: service_healthy
      kong:
        condition: service_started
    ports:
      - "1337:1337"
    networks:
      - kong-net
    restart: unless-stopped

  tra-backend:
    image: node:24-alpine
    container_name: tra-backend
    entrypoint: ["docker-entrypoint.sh"]
    command: ["./docker-entrypoint.sh"]
    working_dir: /app
    volumes:
      # 后端应用目录
      - /home/aaa/travelassistant:/app:rw
    networks:
      - kong-net
    restart: unless-stopped
    tty: true
    stdin_open: true
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "10m"
    environment:
      - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - NODE_VERSION=24.11.1
      - YARN_VERSION=1.22.22

  tra-frontend:
    image: nginx:alpine
    container_name: tra-frontend
    entrypoint: []
    command: ["/app/frontend/docker-entrypoint.sh"]
    ports:
      - "8008:80"
    volumes:
      # Nginx 配置文件
      - /home/aaa/travelassistantFrontend/ngconf/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端应用目录
      - /home/aaa/travelassistantFrontend:/app/frontend:rw
      # Nginx 日志目录
      - /var/log/nginx:/var/log/nginx:rw
      # 上传文件目录
      - /home/aaa/travelassistant/uploads:/app/uploads:rw
    networks:
      - kong-net
    restart: unless-stopped
    tty: true
    stdin_open: true
    logging:
      driver: "json-file"
      options:
        max-file: "3"
        max-size: "10m"
    environment:
      - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - NGINX_VERSION=1.29.4
      - PKG_RELEASE=1
      - DYNPKG_RELEASE=1
      - NJS_VERSION=0.9.4
      - NJS_RELEASE=1

networks:
  kong-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  konga_data:
    driver: local