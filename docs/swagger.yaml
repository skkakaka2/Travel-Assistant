basePath: /api/v1
definitions:
  entity.ActivityEntity:
    properties:
      activityDate:
        description: 活动日期(yyyy-MM-dd)
        type: string
      cost:
        description: 活动费用
        type: number
      createdAt:
        type: string
      description:
        description: 活动描述
        type: string
      endTime:
        description: 结束时间(HH:mm)
        type: string
      id:
        type: integer
      location:
        description: 活动地点
        type: string
      startTime:
        description: 开始时间(HH:mm)
        type: string
      title:
        description: 活动标题
        type: string
      tripId:
        description: 关联的行程ID
        type: integer
      updatedAt:
        type: string
    type: object
  entity.TripEntity:
    properties:
      budget:
        description: 预算
        type: number
      createdAt:
        type: string
      creator:
        type: integer
      description:
        type: string
      endDate:
        type: string
      id:
        type: integer
      startDate:
        type: string
      title:
        type: string
      updatedAt:
        type: string
      userCount:
        type: integer
    type: object
  entity.UserEntity:
    properties:
      avatar:
        type: string
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      phone:
        type: string
      status:
        type: integer
      updatedAt:
        type: string
      userName:
        type: string
    type: object
  service.CreateActivityRequest:
    properties:
      activityDate:
        type: string
      cost:
        minimum: 0
        type: number
      description:
        type: string
      endTime:
        type: string
      location:
        type: string
      startTime:
        type: string
      title:
        maxLength: 255
        type: string
      tripId:
        type: integer
    required:
    - activityDate
    - cost
    - title
    - tripId
    type: object
  service.CreateTripRequest:
    properties:
      budget:
        minimum: 0
        type: number
      description:
        maxLength: 200
        minLength: 0
        type: string
      endDate:
        type: string
      startDate:
        type: string
      title:
        maxLength: 20
        minLength: 3
        type: string
      userCount:
        minimum: 1
        type: integer
    required:
    - budget
    - endDate
    - startDate
    - title
    - userCount
    type: object
  service.GetTripByPaginationResponse:
    properties:
      trips:
        items:
          $ref: '#/definitions/entity.TripEntity'
        type: array
    type: object
  service.UpdateActivityRequest:
    properties:
      activityDate:
        type: string
      cost:
        minimum: 0
        type: number
      description:
        type: string
      endTime:
        type: string
      id:
        type: integer
      location:
        type: string
      startTime:
        type: string
      title:
        maxLength: 255
        type: string
      tripId:
        type: integer
    required:
    - activityDate
    - cost
    - id
    - title
    - tripId
    type: object
  service.UpdateTripRequest:
    properties:
      budget:
        minimum: 0
        type: number
      description:
        maxLength: 200
        minLength: 0
        type: string
      endDate:
        type: string
      id:
        type: integer
      startDate:
        type: string
      title:
        maxLength: 20
        minLength: 3
        type: string
      userCount:
        minimum: 1
        type: integer
    required:
    - budget
    - endDate
    - id
    - startDate
    - title
    - userCount
    type: object
  user.LoginRequest:
    properties:
      password:
        description: 必填，6-20位
        maxLength: 20
        minLength: 6
        type: string
      username:
        description: 必填，3-20位字母数字
        maxLength: 20
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  user.RegisterRequest:
    properties:
      avatar:
        description: 可选，URL格式
        type: string
      email:
        description: 必填，邮箱格式
        type: string
      password:
        description: 必填，6-20位
        maxLength: 20
        minLength: 6
        type: string
      phone:
        description: 可选，11位数字
        type: string
      username:
        description: 必填，3-20位字母数字
        maxLength: 20
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  user.RegisterResponse:
    properties:
      avatar:
        type: string
      email:
        type: string
      id:
        type: integer
      phone:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 旅游助手 API 文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Travel Assistant API
  version: "1.0"
paths:
  /api/v1/activity/create:
    post:
      consumes:
      - application/json
      description: 为指定行程创建活动
      parameters:
      - description: 创建活动请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.CreateActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建活动成功
          schema:
            $ref: '#/definitions/entity.ActivityEntity'
      summary: 创建活动
      tags:
      - Activity
  /api/v1/activity/delete:
    delete:
      consumes:
      - application/json
      description: 删除指定活动
      parameters:
      - description: 活动ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除活动成功
      summary: 删除活动
      tags:
      - Activity
  /api/v1/activity/list:
    get:
      consumes:
      - application/json
      description: 获取指定行程的活动列表，可按日期筛选
      parameters:
      - description: 行程ID
        in: query
        name: tripId
        required: true
        type: integer
      - description: 日期筛选(yyyy-MM-dd)
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取活动列表成功
          schema:
            items:
              $ref: '#/definitions/entity.ActivityEntity'
            type: array
      summary: 获取活动列表
      tags:
      - Activity
  /api/v1/activity/update:
    put:
      consumes:
      - application/json
      description: 更新活动信息
      parameters:
      - description: 更新活动请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.UpdateActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新活动成功
          schema:
            $ref: '#/definitions/entity.ActivityEntity'
      summary: 更新活动
      tags:
      - Activity
  /api/v1/trip/create:
    post:
      consumes:
      - application/json
      description: 创建行程
      parameters:
      - description: 创建行程请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.CreateTripRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建行程成功
          schema:
            $ref: '#/definitions/entity.TripEntity'
      summary: 创建行程
      tags:
      - Trip
  /api/v1/trip/delete:
    delete:
      consumes:
      - application/json
      description: 删除行程
      parameters:
      - description: 行程ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除行程成功
          schema:
            $ref: '#/definitions/entity.TripEntity'
      summary: 删除行程
      tags:
      - Trip
  /api/v1/trip/get:
    get:
      consumes:
      - application/json
      description: 获取行程分页
      parameters:
      - description: 页码
        in: query
        name: page
        required: true
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取行程分页成功
          schema:
            $ref: '#/definitions/service.GetTripByPaginationResponse'
      summary: 获取行程分页
      tags:
      - Trip
  /api/v1/trip/update:
    put:
      consumes:
      - application/json
      description: 更新行程
      parameters:
      - description: 更新行程请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.UpdateTripRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新行程成功
          schema:
            $ref: '#/definitions/entity.TripEntity'
      summary: 更新行程
      tags:
      - Trip
  /api/v1/user/login:
    post:
      consumes:
      - application/json
      description: 登录
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/entity.UserEntity'
      summary: 登录
      tags:
      - User
  /api/v1/user/register:
    post:
      consumes:
      - application/json
      description: 注册用户
      parameters:
      - description: 注册请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            $ref: '#/definitions/user.RegisterResponse'
      summary: 注册用户
      tags:
      - User
securityDefinitions:
  Bearer:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
