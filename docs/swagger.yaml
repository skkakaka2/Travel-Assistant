basePath: /api/v1
definitions:
  entity.TripEntity:
    properties:
      budget:
        description: 预算
        type: number
      createdAt:
        type: string
      creator:
        type: integer
      description:
        type: string
      endDate:
        type: string
      id:
        type: integer
      startDate:
        type: string
      title:
        type: string
      updatedAt:
        type: string
      userCount:
        type: integer
    type: object
  entity.UserEntity:
    properties:
      avatar:
        type: string
      createdAt:
        type: string
      email:
        type: string
      id:
        type: integer
      phone:
        type: string
      status:
        type: integer
      updatedAt:
        type: string
      userName:
        type: string
    type: object
  service.CreateTripRequest:
    properties:
      budget:
        minimum: 0
        type: number
      description:
        maxLength: 200
        minLength: 0
        type: string
      endDate:
        type: string
      startDate:
        type: string
      title:
        maxLength: 20
        minLength: 3
        type: string
      userCount:
        minimum: 1
        type: integer
    required:
    - budget
    - endDate
    - startDate
    - title
    - userCount
    type: object
  service.GetTripByPaginationResponse:
    properties:
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      trips:
        items:
          $ref: '#/definitions/entity.TripEntity'
        type: array
    type: object
  user.LoginRequest:
    properties:
      password:
        description: 必填，6-20位
        maxLength: 20
        minLength: 6
        type: string
      username:
        description: 必填，3-20位字母数字
        maxLength: 20
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  user.RegisterRequest:
    properties:
      avatar:
        description: 可选，URL格式
        type: string
      email:
        description: 必填，邮箱格式
        type: string
      password:
        description: 必填，6-20位
        maxLength: 20
        minLength: 6
        type: string
      phone:
        description: 可选，11位数字
        type: string
      username:
        description: 必填，3-20位字母数字
        maxLength: 20
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  user.RegisterResponse:
    properties:
      avatar:
        type: string
      email:
        type: string
      id:
        type: integer
      phone:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 旅游助手 API 文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Travel Assistant API
  version: "1.0"
paths:
  /api/v1/trip/create:
    post:
      consumes:
      - application/json
      description: 创建行程
      parameters:
      - description: 创建行程请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.CreateTripRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建行程成功
          schema:
            $ref: '#/definitions/entity.TripEntity'
      summary: 创建行程
      tags:
      - Trip
  /api/v1/trip/get:
    get:
      consumes:
      - application/json
      description: 获取行程分页
      parameters:
      - description: 页码
        in: query
        name: page
        required: true
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取行程分页成功
          schema:
            $ref: '#/definitions/service.GetTripByPaginationResponse'
      summary: 获取行程分页
      tags:
      - Trip
  /api/v1/user/login:
    post:
      consumes:
      - application/json
      description: 登录
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/entity.UserEntity'
      summary: 登录
      tags:
      - User
  /api/v1/user/register:
    post:
      consumes:
      - application/json
      description: 注册用户
      parameters:
      - description: 注册请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            $ref: '#/definitions/user.RegisterResponse'
      summary: 注册用户
      tags:
      - User
securityDefinitions:
  Bearer:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
