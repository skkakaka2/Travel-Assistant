basePath: /api/v1
definitions:
  activityentity.ActivityEntity:
    properties:
      activityDate:
        description: 活动日期(yyyy-MM-dd)
        type: string
      cost:
        description: 总费用
        type: integer
      createdAt:
        type: string
      description:
        description: 活动描述
        type: string
      endTime:
        description: 结束时间(HH:mm)
        type: string
      hotel:
        description: 酒店
        type: string
      hotelAddress:
        description: 酒店地址
        type: string
      hotelCost:
        description: 酒店费用
        type: integer
      id:
        type: integer
      latitude:
        type: number
      location:
        description: 活动地点
        type: string
      longitude:
        type: number
      startTime:
        description: 开始时间(HH:mm)
        type: string
      title:
        description: 活动标题
        type: string
      transportCost:
        description: 交通费用
        type: integer
      transportType:
        description: 交通方式
        type: string
      tripId:
        description: 关联的行程ID
        type: integer
      updatedAt:
        type: string
    type: object
  activityentity.ActivityRouteEntity:
    properties:
      createdAt:
        type: string
      distance:
        type: number
      duration:
        type: integer
      endActivityId:
        description: 终点活动id
        type: integer
      id:
        type: integer
      startActivityId:
        description: 起点活动id
        type: integer
      tripId:
        type: integer
      updatedAt:
        type: string
    type: object
  activityservice.CalcActivityRouteRequest:
    properties:
      endActivityId:
        type: integer
      forceRefresh:
        type: boolean
      startActivityId:
        type: integer
    required:
    - endActivityId
    - startActivityId
    type: object
  activityservice.CreateActivityRequest:
    properties:
      activityDate:
        type: string
      cost:
        minimum: 0
        type: integer
      description:
        type: string
      endTime:
        type: string
      hotel:
        maxLength: 255
        type: string
      hotelAddress:
        maxLength: 255
        type: string
      hotelCost:
        minimum: 0
        type: integer
      latitude:
        type: number
      location:
        type: string
      longitude:
        type: number
      startTime:
        type: string
      title:
        maxLength: 255
        type: string
      transportCost:
        minimum: 0
        type: integer
      transportType:
        maxLength: 255
        type: string
      tripId:
        type: integer
    required:
    - activityDate
    - endTime
    - latitude
    - longitude
    - startTime
    - title
    - tripId
    type: object
  activityservice.UpdateActivityRequest:
    properties:
      activityDate:
        type: string
      cost:
        minimum: 0
        type: integer
      description:
        type: string
      endTime:
        type: string
      hotel:
        maxLength: 255
        type: string
      hotelAddress:
        maxLength: 255
        type: string
      hotelCost:
        minimum: 0
        type: integer
      id:
        type: integer
      latitude:
        type: number
      location:
        type: string
      longitude:
        type: number
      startTime:
        type: string
      title:
        maxLength: 255
        type: string
      transportCost:
        minimum: 0
        type: integer
      transportType:
        maxLength: 255
        type: string
      tripId:
        type: integer
    required:
    - activityDate
    - endTime
    - id
    - latitude
    - longitude
    - startTime
    - title
    - tripId
    type: object
  auth.LoginRequest:
    properties:
      password:
        description: 必填，6-20位
        maxLength: 20
        minLength: 6
        type: string
      username:
        description: 必填，3-20位字母数字
        maxLength: 20
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  reviewentity.HotelReviewEntity:
    properties:
      activityId:
        description: 关联活动（酒店信息来源）
        type: integer
      comment:
        description: 评价内容
        type: string
      createdAt:
        type: string
      hotelName:
        description: 酒店名称（快照）
        type: string
      id:
        type: integer
      overallRating:
        description: 评分维度
        type: integer
      priceRating:
        description: 价格性价比 1-5
        type: integer
      tripReviewId:
        description: 关联复盘
        type: integer
      updatedAt:
        type: string
    type: object
  reviewentity.TripReviewEntity:
    properties:
      activityCost:
        description: 活动门票花费
        type: integer
      budgetDiff:
        description: 预算差异 = Budget - TotalCost
        type: integer
      createdAt:
        type: string
      hotelCost:
        description: 酒店花费
        type: integer
      id:
        type: integer
      overallComment:
        description: 行程总结
        type: string
      overallRating:
        description: 用户填写
        type: integer
      status:
        description: 0=待复盘, 1=已完成
        type: integer
      totalCost:
        description: 花费统计（从 Activity 自动汇总）
        type: integer
      transportCost:
        description: 交通花费
        type: integer
      tripId:
        description: 关联行程
        type: integer
      updatedAt:
        type: string
    type: object
  reviewservice.CostBreakdownDetail:
    properties:
      activity:
        type: integer
      budget:
        type: integer
      diff:
        type: integer
      diffPercent:
        type: number
      hotel:
        type: integer
      total:
        type: integer
      transport:
        type: integer
    type: object
  reviewservice.CreateReviewRequest:
    properties:
      hotelReviews:
        items:
          $ref: '#/definitions/reviewservice.HotelReviewInput'
        type: array
      overallComment:
        maxLength: 500
        type: string
      overallRating:
        maximum: 5
        minimum: 1
        type: integer
      tripId:
        type: integer
    required:
    - overallRating
    - tripId
    type: object
  reviewservice.HotelReviewInput:
    properties:
      activityId:
        type: integer
      comment:
        maxLength: 300
        type: string
      overallRating:
        maximum: 5
        minimum: 1
        type: integer
      priceRating:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - activityId
    - overallRating
    - priceRating
    type: object
  reviewservice.ReviewDetailResponse:
    properties:
      costBreakdown:
        $ref: '#/definitions/reviewservice.CostBreakdownDetail'
      hotelReviews:
        items:
          $ref: '#/definitions/reviewentity.HotelReviewEntity'
        type: array
      tripReview:
        $ref: '#/definitions/reviewentity.TripReviewEntity'
    type: object
  reviewservice.UserStatsResponse:
    properties:
      avgHotelRating:
        type: number
      avgOverallRating:
        type: number
      avgPriceRating:
        type: number
      totalOverspent:
        description: 总超支金额
        type: integer
      totalReviews:
        type: integer
      totalSaved:
        description: 总节省金额（预算-实际）
        type: integer
    type: object
  tripentity.TripEntity:
    properties:
      activities:
        description: 关联关系 - 行程有多个活动
        items:
          $ref: '#/definitions/activityentity.ActivityEntity'
        type: array
      budget:
        description: 预算
        type: integer
      cost:
        type: integer
      createdAt:
        type: string
      creator:
        type: integer
      description:
        type: string
      endDate:
        type: string
      id:
        type: integer
      isOverBudget:
        description: 是否超预算
        type: integer
      startDate:
        type: string
      title:
        type: string
      updatedAt:
        type: string
      userCount:
        type: integer
    type: object
  tripservice.CreateTripRequest:
    properties:
      budget:
        minimum: 0
        type: number
      description:
        maxLength: 200
        minLength: 0
        type: string
      endDate:
        type: string
      startDate:
        type: string
      title:
        maxLength: 20
        minLength: 3
        type: string
      userCount:
        minimum: 1
        type: integer
    required:
    - budget
    - endDate
    - startDate
    - title
    - userCount
    type: object
  tripservice.GetTripByPaginationResponse:
    properties:
      trips:
        items:
          $ref: '#/definitions/tripentity.TripEntity'
        type: array
    type: object
  tripservice.UpdateTripRequest:
    properties:
      budget:
        minimum: 0
        type: number
      description:
        maxLength: 200
        minLength: 0
        type: string
      endDate:
        type: string
      id:
        type: integer
      startDate:
        type: string
      title:
        maxLength: 20
        minLength: 3
        type: string
      userCount:
        minimum: 1
        type: integer
    required:
    - budget
    - endDate
    - id
    - startDate
    - title
    - userCount
    type: object
  user.RegisterRequest:
    properties:
      password:
        description: 必填，6-20位
        maxLength: 20
        minLength: 6
        type: string
      phone:
        description: 可选，11位数字
        type: string
      username:
        description: 必填，3-20位字母数字
        maxLength: 20
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  user.RegisterResponse:
    properties:
      id:
        type: integer
      phone:
        type: string
      userName:
        type: string
    type: object
  user.UpdateUserRequest:
    properties:
      car:
        maxLength: 255
        type: string
      carNumber:
        maxLength: 255
        type: string
      home:
        maxLength: 255
        type: string
      homeAddress:
        maxLength: 255
        type: string
      homeLatitude:
        type: number
      homeLongitude:
        type: number
      perKilometerCost:
        minimum: 0
        type: integer
      phone:
        description: 可选，11位数字
        type: string
    type: object
  userentity.UserEntity:
    properties:
      avatar:
        type: string
      car:
        type: string
      carNumber:
        type: string
      createdAt:
        type: string
      email:
        type: string
      home:
        type: string
      homeAddress:
        type: string
      homeLatitude:
        type: number
      homeLongitude:
        type: number
      id:
        type: integer
      perKilometerCost:
        description: 每公里油费
        type: integer
      phone:
        type: string
      status:
        type: integer
      updatedAt:
        type: string
      userName:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 旅游助手 API 文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Travel Assistant API
  version: "1.0"
paths:
  /api/v1/activity/create:
    post:
      consumes:
      - application/json
      description: 为指定行程创建活动
      parameters:
      - description: 创建活动请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/activityservice.CreateActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建活动成功
          schema:
            $ref: '#/definitions/activityentity.ActivityEntity'
      summary: 创建活动
      tags:
      - Activity
  /api/v1/activity/delete:
    delete:
      consumes:
      - application/json
      description: 删除指定活动
      parameters:
      - description: 活动ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除活动成功
      summary: 删除活动
      tags:
      - Activity
  /api/v1/activity/list:
    get:
      consumes:
      - application/json
      description: 获取指定行程的活动列表，可按日期筛选
      parameters:
      - description: 行程ID
        in: query
        name: tripId
        required: true
        type: integer
      - description: 日期筛选(yyyy-MM-dd)
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取活动列表成功
          schema:
            items:
              $ref: '#/definitions/activityentity.ActivityEntity'
            type: array
      summary: 获取活动列表
      tags:
      - Activity
  /api/v1/activity/route/calc:
    post:
      consumes:
      - application/json
      description: 计算两个活动之间的路线并保存，已存在的路线会从缓存直接返回
      parameters:
      - description: 计算活动路线请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/activityservice.CalcActivityRouteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 计算路线成功
          schema:
            $ref: '#/definitions/activityentity.ActivityRouteEntity'
      summary: 计算并保存活动路线
      tags:
      - Activity
  /api/v1/activity/update:
    put:
      consumes:
      - application/json
      description: 更新活动信息
      parameters:
      - description: 更新活动请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/activityservice.UpdateActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新活动成功
          schema:
            $ref: '#/definitions/activityentity.ActivityEntity'
      summary: 更新活动
      tags:
      - Activity
  /api/v1/review/create:
    post:
      consumes:
      - application/json
      description: 创建行程复盘，包含酒店评分
      parameters:
      - description: 创建复盘请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/reviewservice.CreateReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/reviewservice.ReviewDetailResponse'
      summary: 创建复盘
      tags:
      - Review
  /api/v1/review/get:
    get:
      consumes:
      - application/json
      description: 获取指定行程的复盘详情
      parameters:
      - description: 行程ID
        in: query
        name: tripId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/reviewservice.ReviewDetailResponse'
      summary: 获取复盘详情
      tags:
      - Review
  /api/v1/review/stats:
    get:
      consumes:
      - application/json
      description: 获取用户所有复盘的统计数据
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/reviewservice.UserStatsResponse'
      summary: 获取用户复盘统计
      tags:
      - Review
  /api/v1/review/trips/available:
    get:
      consumes:
      - application/json
      description: 获取已结束且未复盘的行程列表
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            items:
              $ref: '#/definitions/tripentity.TripEntity'
            type: array
      summary: 获取可复盘行程
      tags:
      - Review
  /api/v1/review/trips/completed:
    get:
      consumes:
      - application/json
      description: 获取已完成复盘的行程列表
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            items:
              $ref: '#/definitions/reviewservice.ReviewDetailResponse'
            type: array
      summary: 获取已完成复盘
      tags:
      - Review
  /api/v1/trip/create:
    post:
      consumes:
      - application/json
      description: 创建行程
      parameters:
      - description: 创建行程请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tripservice.CreateTripRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建行程成功
          schema:
            $ref: '#/definitions/tripentity.TripEntity'
      summary: 创建行程
      tags:
      - Trip
  /api/v1/trip/delete:
    delete:
      consumes:
      - application/json
      description: 删除行程
      parameters:
      - description: 行程ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除行程成功
          schema:
            $ref: '#/definitions/tripentity.TripEntity'
      summary: 删除行程
      tags:
      - Trip
  /api/v1/trip/get:
    get:
      consumes:
      - application/json
      description: 获取行程分页
      parameters:
      - description: 页码
        in: query
        name: page
        required: true
        type: integer
      - description: 每页条数
        in: query
        name: pageSize
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取行程分页成功
          schema:
            $ref: '#/definitions/tripservice.GetTripByPaginationResponse'
      summary: 获取行程分页
      tags:
      - Trip
  /api/v1/trip/update:
    put:
      consumes:
      - application/json
      description: 更新行程
      parameters:
      - description: 更新行程请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/tripservice.UpdateTripRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新行程成功
          schema:
            $ref: '#/definitions/tripentity.TripEntity'
      summary: 更新行程
      tags:
      - Trip
  /api/v1/user/login:
    post:
      consumes:
      - application/json
      description: 登录
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/userentity.UserEntity'
      summary: 登录
      tags:
      - User
  /api/v1/user/register:
    post:
      consumes:
      - application/json
      description: 注册用户
      parameters:
      - description: 注册请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            $ref: '#/definitions/user.RegisterResponse'
      summary: 注册用户
      tags:
      - User
  /api/v1/user/update:
    put:
      consumes:
      - application/json
      description: 更新用户
      parameters:
      - description: 更新用户请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新用户成功
          schema:
            $ref: '#/definitions/userentity.UserEntity'
      summary: 更新用户
      tags:
      - User
securityDefinitions:
  Bearer:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
