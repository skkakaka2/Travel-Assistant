# 开发环境配置文件
# 这个文件会覆盖 application.yml 中的同名配置

server:
  # 服务端口
  port: 8080

spring:
  # 数据源配置
  datasource:
    # 数据库连接地址
    # useSSL=false: 不使用 SSL 连接
    # serverTimezone=Asia/Shanghai: 设置时区
    # characterEncoding=utf8: 字符编码
    url: jdbc:mysql://localhost:3306/travel_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    # 数据库用户名
    username: root
    # 数据库密码（请修改为您自己的密码）
    password: admin
    # MySQL 8.x 驱动类
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池配置（HikariCP 是 Spring Boot 默认连接池）
    hikari:
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接数
      maximum-pool-size: 20
      # 连接超时时间（毫秒）
      connection-timeout: 30000
      # 连接最大存活时间（毫秒）
      max-lifetime: 1800000

# 日志配置
logging:
  level:
    # 根日志级别
    root: info
    # 项目代码日志级别（开发环境用 debug）
    com.travel.assistant: debug
    # SQL 日志
    com.travel.assistant.modules: debug